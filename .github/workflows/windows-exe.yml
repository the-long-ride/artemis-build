name: Windows standalone Artemis executable

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "artemis/**"
      - "apps/**"
      - "mcp_server/**"
      - "packages/artemis-accessibility-helper/**"
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/windows-exe.yml"
  push:
    branches: ["feat/windows-standalone-exe"]

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  windows-exe:
    name: Build Artemis CLI for Windows x64
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python runtime
        run: uv sync --locked

      - name: Verify agent installation unit tests
        run: uv run --locked pytest tests/unit/test_agent_skill_install.py -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: apps/showcase_ui/package-lock.json

      - name: Compile Showcase UI for distribution
        shell: pwsh
        run: |
          npm ci --prefix apps/showcase_ui
          npm run build --prefix apps/showcase_ui

      - name: Build one-file terminal executable via uv and PyInstaller
        shell: pwsh
        run: uv run --locked --with pyinstaller==6.16.0 pyinstaller --clean --noconfirm packaging/artemis_windows.spec

      - name: Smoke-test executable without uv or Python invocation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'dist/artemis.exe'
          if (-not (Test-Path $exe)) { throw 'Missing Artemis binary' }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Version smoke test failed' }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI smoke test failed' }
          & $exe agents --help
          if ($LASTEXITCODE -ne 0) { throw 'Agents CLI smoke test failed' }
          & $exe agents install --target all --dry-run
          if ($LASTEXITCODE -ne 0) { throw 'Skill installer smoke test failed' }
          & $exe mcp --generate-config codex | Out-File -FilePath "$env:RUNNER_TEMP/artemis-codex-mcp.txt" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'MCP config smoke test failed' }
          $config = Get-Content "$env:RUNNER_TEMP/artemis-codex-mcp.txt" -Raw
          if ($config -notmatch 'args\s*=\s*\["mcp"\]') {
            throw 'Frozen MCP config must invoke artemis.exe mcp'
          }

      - name: Generate SHA256 file
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path dist/artemis.exe -Algorithm SHA256).Hash
          "$hash  artemis.exe" | Set-Content -Path dist/artemis.exe.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: artemis-windows-x64-exe
          path: |
            dist/artemis.exe
            dist/artemis.exe.sha256
          if-no-files-found: error
          retention-days: 14
